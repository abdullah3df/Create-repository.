<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الإدارية - بتصميم محدث</title>
    <style>
        /* ------------------------------------------- */
        /* 1. التنسيقات الأساسية وإعدادات الخطوط */
        /* ------------------------------------------- */
        :root {
            --primary-color: #007bff; /* أزرق */
            --secondary-color: #6c757d; /* رمادي */
            --bg-color: #f8f9fa; /* لون خلفية خفيف */
            --sidebar-bg: #343a40; /* لون الخلفية الداكن للقائمة */
            --text-light: #f8f9fa;
            --text-dark: #212529;
            --notification-color: #dc3545; /* أحمر للإشعارات */
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif; /* يفضل استبداله بخط عربي جيد */
        }
        body {
            background-color: var(--bg-color);
            display: flex;
            min-height: 100vh;
            direction: rtl;
        }

        /* ------------------------------------------- */
        /* 2. القائمة الجانبية المطوية (Sidebar) */
        /* ------------------------------------------- */
        .sidebar {
            width: 70px; /* عرض القائمة المطوية */
            background-color: var(--sidebar-bg);
            color: var(--text-light);
            transition: width 0.3s;
            overflow-x: hidden;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            padding-top: 20px;
        }

        /* 2.1. اسم المستخدم في الأعلى (التعديل المطلوب) */
        .user-profile-header {
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center; /* لجعله يتوسط في الوضع المطوي */
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-light);
        }
        .user-name {
            display: none; /* مخفي في الوضع المطوي */
            margin-right: 10px;
            white-space: nowrap;
        }
        
        /* 2.2. روابط التنقل */
        .navigation-links a {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            color: var(--text-light);
            text-decoration: none;
            transition: background-color 0.2s;
            justify-content: center;
        }
        .navigation-links a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .navigation-links span {
            display: none; /* مخفي في الوضع المطوي */
        }

        /* ------------------------------------------- */
        /* 3. الشريط العلوي (Top Navbar) */
        /* ------------------------------------------- */
        .main-content {
            flex-grow: 1;
        }
        .top-navbar {
            background-color: #fff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }
        
        /* 3.1. مربع البحث (التعديل المطلوب) */
        .search-container {
            display: flex;
            align-items: center;
            background-color: var(--bg-color);
            border-radius: 5px;
            padding: 5px 10px;
            border: 1px solid #ccc;
        }
        .search-container input {
            border: none;
            background: transparent;
            padding: 5px;
            margin-left: 10px;
            outline: none;
            text-align: right; /* لمحاذاة النص داخل البحث لليمين */
        }
        .search-container button {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--secondary-color);
        }

        /* 3.2. زر الإشعارات (التعديل المطلوب) */
        .actions-right {
            display: flex;
            align-items: center;
        }
        .notifications-button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--secondary-color);
            position: relative;
            margin-right: 15px;
        }
        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: var(--notification-color);
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.7rem;
            line-height: 1;
            min-width: 20px;
            text-align: center;
        }

        /* ------------------------------------------- */
        /* 4. تفاعلات JavaScript - حالة التوسع */
        /* ------------------------------------------- */
        .sidebar.expanded {
            width: 250px; /* عرض القائمة المفتوحة */
        }
        .sidebar.expanded .user-profile-header {
            justify-content: flex-start;
        }
        .sidebar.expanded .user-name {
            display: inline; /* إظهار اسم المستخدم */
        }
        .sidebar.expanded .navigation-links a {
            justify-content: flex-start;
        }
        .sidebar.expanded .navigation-links span {
            display: inline; /* إظهار نص الروابط */
            margin-right: 15px;
        }
        .menu-toggle {
             background: none;
             border: none;
             font-size: 1.5rem;
             cursor: pointer;
             color: var(--secondary-color);
             margin-left: 15px;
        }

        /* محتوى الصفحة الرئيسي */
        .page-content {
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">

        <div class="user-profile-header">
            <div class="user-avatar">AD</div>
            <span class="user-name">سامر الشمري - Admin_Master</span>
        </div>
        
        <nav class="navigation-links">
            <a href="#">🏠<span>لوحة التحكم</span></a>
            <a href="#">⚙️<span>الإعدادات</span></a>
            <a href="#">👥<span>إدارة المستخدمين</span></a>
            <a href="#">📊<span>التقارير</span></a>
            <a href="#">🚪<span>تسجيل الخروج</span></a>
        </nav>
    </div>

    <div class="main-content">
        
        <header class="top-navbar">
            <div class="left-section">
                <button class="menu-toggle" id="menuToggle">☰</button>
            </div>
            
            <div class="actions-right">
                 <div class="search-container">
                    <input type="text" placeholder="ابحث هنا عن...">
                    <button class="search-icon">🔍</button>
                </div>
                
                <button class="notifications-button">
                    🔔
                    <span class="notification-badge">5</span> </button>
            </div>
        </header>

        <div class="page-content">
            <h1>مرحباً بك يا Admin_Master</h1>
            <p>هذه هي صفحة لوحة التحكم المحدثة.</p>
            <p>تم تطبيق التعديلات بنجاح: اسم المستخدم في الأعلى، مربع البحث، وزر الإشعارات.</p>
        </div>
    </div>

    <script>
        document.getElementById('menuToggle').addEventListener('click', function() {
            var sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('expanded');
        });
    </script>

</body>
</html>
